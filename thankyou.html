<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You!</title>
    <style>
        body {
            background: linear-gradient(135deg, #9daaf2 0%, #ff6a3d 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .popup {
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(26, 34, 56, 0.25);
            padding: 40px 30px;
            text-align: center;
            animation: popIn 0.7s cubic-bezier(.68,-0.55,.27,1.55);
        }
        .popup h1 {
            font-size: 2.2rem;
            color: #1a2238;
            margin-bottom: 10px;
        }
        .popup p {
            font-size: 1.2rem;
            color: #22223b;
        }
        .emoji {
            font-size: 2.5rem;
            display: block;
            margin-bottom: 10px;
            animation: bounce 1.2s infinite alternate;
        }
        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            80% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); }
        }
        @keyframes bounce {
            0% { transform: translateY(0); }
            100% { transform: translateY(-15px); }
        }
    </style>
</head>
<body>
    <div class="popup">
        <span class="emoji">😊😊</span>
        <h1>Thank You!</h1>
        <p>Thanks for contacting our website.<br>Your message has been received!</p>
    </div>
</body>
</html>
